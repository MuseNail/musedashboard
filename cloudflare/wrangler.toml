name             = "musedashboard"
main             = "worker.js"
compatibility_date = "2024-11-20"

# ── R2 bucket binding ─────────────────────────────────────────────────────────
# Create the bucket first:  wrangler r2 bucket create musedashboard-photos
[[r2_buckets]]
binding     = "PHOTOS_BUCKET"
bucket_name = "musedashboard-photos"

# ── Workers KV binding ────────────────────────────────────────────────────────
# Fast config read cache. Create namespace: wrangler kv namespace create CONFIG_CACHE
[[kv_namespaces]]
binding = "CONFIG_KV"
id      = "e293d33d03ab48fd9e3cbef625193546"

# ── Durable Object binding ─────────────────────────────────────────────────────
# Enables real-time WebSocket sync. Migrations run automatically on deploy.
[[durable_objects.bindings]]
name       = "SALON_DO"
class_name = "MuseSalonDO"

[[migrations]]
tag                = "v1"
new_sqlite_classes = ["MuseSalonDO"]

# ── Secrets ───────────────────────────────────────────────────────────────────
# Set each secret once via the CLI — never commit secret values to this file:
#
#   wrangler secret put SHEETS_URL
#   wrangler secret put SQUARE_TOKEN
#
# SHEETS_URL    — Google Apps Script doPost endpoint (the /exec URL)
# SQUARE_TOKEN  — Square access token (sandbox or production)

# ── Optional environment variables ────────────────────────────────────────────
# [vars]
# SQUARE_BASE_URL = "https://connect.squareup.com"
# Uncomment and set to the sandbox URL during testing:
# SQUARE_BASE_URL = "https://connect.squareupsandbox.com"
