name               = "musedashboard"
main               = "worker.js"
compatibility_date = "2024-11-20"

# ── Observability ──────────────────────────────────────────────────────────────
# Persist console.* output so errors are queryable in the Cloudflare dashboard
# (Workers & Pages → musedashboard → Logs) instead of being ephemeral. Free tier
# included; also viewable live with `wrangler tail`. head_sampling_rate=1 = keep all.
[observability]
enabled = true
head_sampling_rate = 1

# ── R2 bucket binding ─────────────────────────────────────────────────────────
# Create the bucket first:  wrangler r2 bucket create musedashboard-photos
[[r2_buckets]]
binding     = "PHOTOS_BUCKET"
bucket_name = "musedashboard-photos"

# ── Durable Object binding ─────────────────────────────────────────────────────
# Enables real-time WebSocket sync. Migrations run automatically on deploy.
[[durable_objects.bindings]]
name       = "SALON_DO"
class_name = "MuseSalonDO"

[[migrations]]
tag                = "v1"
new_sqlite_classes = ["MuseSalonDO"]

# ── Secrets ───────────────────────────────────────────────────────────────────
# Set each secret once via the CLI — never commit secret values to this file:
#
#   wrangler secret put SQUARE_TOKEN
#
# SQUARE_TOKEN        — Square access token (sandbox or production)
# RESTORE_TOKEN       — (optional) gates POST /state/restore and POST /state/reset
# VAPID_PRIVATE_KEY   — Web Push signing key (JWK JSON string). Set once:
#                         wrangler secret put VAPID_PRIVATE_KEY
#                       (matching public key is VAPID_PUBLIC_KEY below + js/app/config.js)
# ORIGIN_GATE_ENABLED — (optional) "true" enables the Origin allow-list gate; unset/"false" = off (default).
#                       Flip live with `wrangler secret put ORIGIN_GATE_ENABLED` — no redeploy. Built-in
#                       allowed origin: https://musenail.github.io. Add more via ALLOWED_ORIGINS.
# ALLOWED_ORIGINS     — (optional) extra comma-separated origins to allow (e.g. a future custom domain)
# GCAL_CLIENT_SECRET  — Google OAuth client secret for the server-side Calendar refresh-token flow
#                       (fixes the iPad "loses sync" problem). Set once:
#                         wrangler secret put GCAL_CLIENT_SECRET
#                       ALSO add this Authorized redirect URI to that OAuth client in Google Cloud Console:
#                         https://musedashboard.musenailandspa.workers.dev/gcal/callback
# HELCIM_API_TOKEN    — Helcim "Payment Hardware API" token (api-token header; stays server-side, never in
#                       the client). Powers /helcim/purchase|refund|transactions. Set once:
#                         wrangler secret put HELCIM_API_TOKEN
# HELCIM_WEBHOOK_VERIFIER — Helcim webhook "verifier token" (base64) for HMAC-SHA256 (Svix scheme) signature
#                       checks on the terminal result webhook. Set once:
#                         wrangler secret put HELCIM_WEBHOOK_VERIFIER
#                       Register the webhook in Helcim → All Tools → Integrations → Webhooks with URL:
#                         https://musedashboard.musenailandspa.workers.dev/terminal/webhook
#                       (Helcim rejects webhook URLs containing the word "helcim" — hence /terminal/webhook.)

# ── Environment variables ──────────────────────────────────────────────────────
[vars]
# Web Push: non-secret VAPID public key (matches js/app/config.js VAPID_PUBLIC_KEY)
# + the contact subject sent in the VAPID JWT. The PRIVATE key is a secret (above).
VAPID_PUBLIC_KEY = "BCoL00zoZ6BMiurBxzhh05439KLXdDCgmd6z6bQzOl4r30VYBq7Xzvf5Xl5DqsuqUchNE7xnfcaCrvgUvfJ2uKk"
VAPID_SUBJECT    = "mailto:info@musenailandspa.com"
# Google Calendar OAuth client id (public, not secret). Matches js/app/features/calendar.js.
GCAL_CLIENT_ID   = "174518644579-5vgt7vvllm2ekpk0gb8l4sa4f3va9r9l.apps.googleusercontent.com"
