<!DOCTYPE html><html><head><meta charset="utf-8"><title>Staff Billing — receipt mockup</title>
<style>
  /* Screen-only chrome so the mockup is readable in a browser; the real export uses just the .sheet/.receipt rules. */
  body{background:#e9e9ee;margin:0;padding:24px;font-family:'Courier New',monospace}
  .pagewrap{max-width:11in;margin:0 auto 28px;background:#fff;box-shadow:0 2px 14px rgba(0,0,0,.18);padding:.4in;box-sizing:border-box}
  .pagelbl{font-family:Arial,sans-serif;font-size:12px;color:#888;margin:0 auto 6px;max-width:11in;text-transform:uppercase;letter-spacing:1px}

  /* ===== these are the rules that go into payrollExportStaffPDF ===== */
  /* @page{size:11in 8.5in;margin:.4in}  (landscape) */
  .body-print{color:#000;font-size:10pt}
  .sheet{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .receipt{border:1px dashed #999;border-radius:6px;padding:9px 11px;break-inside:avoid;page-break-inside:avoid;line-height:1.32}
  .ctr{text-align:center}
  .dash{border-top:1px dashed #000;margin:5px 0}
  .line{display:flex;justify-content:space-between;gap:10px}
  .line span:last-child{font-variant-numeric:tabular-nums}
  /* ================================================================= */
</style></head>
<body>
<script>
  const PERIOD = 'May 26 – Jun 8, 2026';
  const DAYS = ['Tue, 5/26','Wed, 5/27','Thu, 5/28','Fri, 5/29','Sat, 5/30','Sun, 5/31','Mon, 6/1','Tue, 6/2','Wed, 6/3','Thu, 6/4','Fri, 6/5','Sat, 6/6','Sun, 6/7','Mon, 6/8'];
  const STAFF = [
    { name:'Lee Hoang',   vals:[264,330,0,374,368,416,293,303,283,193,0,0,0,403], total:3227 },
    { name:'Miley',       vals:[225,402,309,376,408,0,0,278,332,409,401,391,177,492], total:4200 },
    { name:'Mary Le',     vals:[190,0,0,286,367,0,0,289,0,0,268,401,0,0], total:1801 },
    { name:'Sarah Hoang', vals:[193,217,127,136,417,416,30,318,182,198,245,510,91,367], total:3447, refund:128.5 },
    { name:'Kat L',       vals:[120,0,210,0,330,290,0,140,0,0,180,300,0,0], total:1570 },
    { name:'Anna Nguyen', vals:[200,180,0,220,260,0,0,190,210,0,240,260,0,180], total:1940 },
    { name:'Bella Tran',  vals:[0,150,160,180,200,210,0,0,170,190,0,220,140,160], total:1780 },
    { name:'Cara Lopez',  vals:[300,0,0,280,310,0,0,290,0,0,270,330,0,300], total:2080 },
  ];
  const receipt = s => {
    const rows = DAYS.map((d,i)=>`<div class="line"><span>${d}</span><span>$${s.vals[i]}</span></div>`).join('');
    const rf = s.refund ? `<div class="line"><span>Refunds</span><span>-$${s.refund.toFixed(2)}</span></div><div class="line"><span>Net</span><span>$${(s.total-s.refund).toFixed(2)}</span></div>` : '';
    return `<div class="receipt">
      <div class="ctr">Muse Nails &amp; Spa</div>
      <div class="ctr">${s.name}</div>
      <div class="ctr">${PERIOD}</div>
      <div class="dash"></div>
      ${rows}
      <div class="dash"></div>
      <div class="line"><span>Total</span><span>$${s.total.toFixed(2)}</span></div>
      ${rf}
    </div>`;
  };
  // 8 per sheet = 2 rows of 4
  let out='';
  for(let i=0;i<STAFF.length;i+=8){
    const chunk=STAFF.slice(i,i+8).map(receipt).join('');
    out+=`<div class="pagelbl">Printable sheet ${i/8+1} — two rows of receipts</div><div class="pagewrap"><div class="body-print"><div class="sheet">${chunk}</div></div></div>`;
  }
  document.body.insertAdjacentHTML('beforeend', out);
</script>
</body></html>
