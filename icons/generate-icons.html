<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Generate Muse PWA Icons</title>
<style>
  body { font-family: sans-serif; background: #e8ecee; display: flex; flex-direction: column; align-items: center; padding: 40px 20px; gap: 32px; }
  h1 { color: #1a5252; margin: 0; font-size: 22px; }
  p { color: #555; margin: 0; font-size: 14px; text-align: center; max-width: 440px; }
  .card { background: #fff; border-radius: 16px; padding: 28px 32px; box-shadow: 0 2px 16px rgba(0,0,0,.08); display: flex; flex-direction: column; align-items: center; gap: 16px; }
  canvas { border-radius: 22%; box-shadow: 0 2px 12px rgba(0,0,0,.15); }
  button { background: #1a5252; color: #fff; border: none; border-radius: 10px; padding: 10px 24px; font-size: 14px; font-weight: 700; cursor: pointer; letter-spacing: .3px; }
  button:hover { background: #0f3d3d; }
  .label { font-size: 13px; color: #888; }
</style>
</head>
<body>

<h1>Muse PWA Icon Generator</h1>
<p>Click each button to download the placeholder icon. Drop both files into the <code>icons/</code> folder, then delete this HTML file before deploying.</p>

<div class="card">
  <canvas id="c192" width="192" height="192"></canvas>
  <div class="label">icon-192.png — home screen / manifest</div>
  <button onclick="download('c192','icon-192.png')">Download icon-192.png</button>
</div>

<div class="card">
  <canvas id="c512" width="512" height="512"></canvas>
  <div class="label">icon-512.png — splash screen / maskable</div>
  <button onclick="download('c512','icon-512.png')">Download icon-512.png</button>
</div>

<script>
function drawIcon(canvasId) {
  const canvas = document.getElementById(canvasId);
  const size   = canvas.width;
  const ctx    = canvas.getContext('2d');
  const cx     = size / 2;

  // Background
  ctx.fillStyle = '#1a5252';
  ctx.fillRect(0, 0, size, size);

  // Subtle inner glow ring — gives it depth
  const grad = ctx.createRadialGradient(cx, cx * 0.8, size * 0.05, cx, cx, size * 0.55);
  grad.addColorStop(0, 'rgba(255,255,255,0.10)');
  grad.addColorStop(1, 'rgba(0,0,0,0.15)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, size, size);

  // "M" lettermark
  ctx.fillStyle = '#ffffff';
  ctx.font = `900 ${Math.round(size * 0.52)}px Manrope, Georgia, serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  // Slight upward offset so letter sits visually centered
  ctx.fillText('M', cx, cx * 1.04);

  // Thin bottom wordmark — only on the 512 version for richness
  if (size >= 512) {
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.font = `600 ${Math.round(size * 0.062)}px Manrope, Arial, sans-serif`;
    ctx.letterSpacing = `${size * 0.018}px`;
    ctx.fillText('MUSE', cx, cx * 1.62);
  }
}

function download(canvasId, filename) {
  const canvas = document.getElementById(canvasId);
  const link   = document.createElement('a');
  link.download = filename;
  link.href     = canvas.toDataURL('image/png');
  link.click();
}

drawIcon('c192');
drawIcon('c512');
</script>
</body>
</html>
